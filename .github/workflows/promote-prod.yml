name: Production Approval

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Jenkins build number"
        required: true
        type: string

jobs:
  production-approval:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Production approved
        run: echo "Production deployment approved for build ${{ inputs.image_tag }}"